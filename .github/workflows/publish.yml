name: Publish IPTV playlists

on:
  push:
    branches: [main]
    paths: ['projects/**', 'sources.json', 'web/**', 'scripts/**', 'test/**', 'package.json', '.github/workflows/publish.yml']
  schedule:
    - cron: '17 4,16 * * *'
  workflow_dispatch:
    inputs:
      refresh_epg:
        description: 'Refresh the EPG channel index (channel names and IDs only)'
        type: boolean
        default: false

concurrency:
  group: iptv-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run check
      - name: Generate all projects
        env:
          REFRESH_EPG: ${{ inputs.refresh_epg }}
        run: |
          arguments=(--update-state)
          if [[ "$REFRESH_EPG" == "true" ]]; then arguments+=(--refresh-epg); fi
          npm run build -- "${arguments[@]}"
      - name: Commit playlists and source changes
        run: |
          git add -A -- playlists state channel-changes.log
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update IPTV playlists and source state'
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
